name: Watch upstream releases (fork)

# Opens an issue mentioning the owner when k1tbyte/Wand-Enhancer publishes a
# release newer than the latest one of this fork. It builds nothing: the owner
# runs "Build and publish release (fork)" by hand.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    env:
      UPSTREAM_REPO: k1tbyte/Wand-Enhancer
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Compare releases and open an issue if upstream is ahead
        shell: bash
        run: |
          set -euo pipefail

          upstream=$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name)
          # No release yet in this fork is a valid state: everything upstream is news.
          ours=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          echo "upstream=$upstream ours=${ours:-<none>}"

          if [ "$upstream" = "$ours" ]; then
            echo "Fork is up to date."
            exit 0
          fi
          newest=$(printf '%s\n%s\n' "${ours:-0}" "$upstream" | sort -V | tail -n 1)
          if [ "$newest" != "$upstream" ]; then
            echo "Fork release $ours is ahead of upstream $upstream; nothing to do."
            exit 0
          fi

          title="Nueva versión upstream $upstream"
          # state=all: an issue closed by hand must not be reopened as a new one.
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "\"$title\" in:title" --json title --jq "[.[] | select(.title == \"$title\")] | length")
          if [ "$existing" != "0" ]; then
            echo "Issue '$title' already exists."
            exit 0
          fi

          body=$(printf '%s\n' \
            "@${GITHUB_REPOSITORY_OWNER}: \`$UPSTREAM_REPO\` ha publicado [$upstream](https://github.com/$UPSTREAM_REPO/releases/tag/$upstream); la última release de este fork es \`${ours:-ninguna}\`." \
            "" \
            "Para generar los \`.exe\`: Actions → **Build and publish release (fork)** → **Run workflow**. Ese workflow fusiona la última release del upstream antes de compilar." \
            "" \
            "Cierra este issue cuando hayas terminado." )
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
